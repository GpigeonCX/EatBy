name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s deploy/kindle -p 'test_*.py' -v
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: go test ./...
        env:
          EATBY_KINDLE_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - run: docker build -t eatby:test .

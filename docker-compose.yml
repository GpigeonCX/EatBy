services:
  app:
    image: ${EATBY_IMAGE:-eatby:local}
    build: .
    restart: unless-stopped
    env_file:
      - ${EATBY_ENV_FILE:-.env}
    environment:
      PANTRY_DATA: /data
      TZ: Asia/Shanghai
    volumes:
      - ${EATBY_DATA_DIR:-./production-data}:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
